<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Anant Bafna</title>
    <!-- Include qrious library for client-side QR code generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            margin: 20px;
        }

        .card-header-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            height: 130px;
            position: relative;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .avatar-placeholder {
            width: 82px;
            height: 82px;
            background: #e2e8f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
        }

        .profile-content {
            padding: 55px 24px 24px 24px;
            text-align: center;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            background-color: #059669;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .verified-badge::before {
            content: "✓";
            margin-right: 5px;
            font-weight: bold;
        }

        .btn-qr {
            width: 100%;
            background-color: #e0f2fe;
            color: #0369a1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .btn-qr:hover {
            background-color: #bae6fd;
        }

        .info-table {
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
            text-align: left;
        }

        .info-row {
            display: flex;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            flex: 0 0 35%;
            background-color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .info-value {
            flex: 0 0 65%;
            background-color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            color: #334155;
        }

        /* Modal / QR Display styling */
        .qr-modal {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            text-align: center;
        }

        .qr-modal canvas {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card-header-bg">
            <div class="avatar-container">
                <div class="avatar-placeholder">
                    <!-- Simple SVG Avatar Icon -->
                    <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <div class="profile-content">
            <h1 class="profile-name">Anant Bafna</h1>
            <div>
                <span class="verified-badge">Verified</span>
            </div>

            <button class="btn-qr" onclick="toggleQRCode()">
                Generate vCard / QR 
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>

            <!-- QR Code Display Box -->
            <div id="qrModal" class="qr-modal">
                <p style="font-size: 13px; color: #64748b; font-weight: 500;">Scan to view contact details:</p>
                <canvas id="qrCanvas"></canvas>
            </div>

            <div class="info-table">
                <div class="info-row">
                    <div class="info-label">DOB</div>
                    <div class="info-value">29/12/2007</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Gender</div>
                    <div class="info-value">Male</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Mobile</div>
                    <div class="info-value">9073109955</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Email</div>
                    <div class="info-value">anantbafna7@gmail.com</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let qrGenerated = false;

        function toggleQRCode() {
            const modal = document.getElementById('qrModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
                if (!qrGenerated) {
                    // Generate vCard format string to encode inside the QR code
                    const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Anant Bafna\nBDAY:20071229\nGENDER:M\nTEL:9073109955\nEMAIL:anantbafna7@gmail.com\nEND:VCARD`;
                    
                    new QRious({
                        element: document.getElementById('qrCanvas'),
                        value: vcardData,
                        size: 150,
                        level: 'M'
                    });
                    qrGenerated = true;
                }
            }
        }
    </script>
</body>
</html>
